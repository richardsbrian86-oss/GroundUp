kind = "video"
previewPath = "/ground-up-promo/"
title = "Ground Up Promo Video"
description = "A short animated promo video for Ground Up — A Jiu-Jitsu Reference: black/cream/red ink-sketch aesthetic showcasing the 74-technique library and the Escape Challenge."
version = "1.0.0"
id = "artifacts/ground-up-promo"
router = "path"

[[services]]
name = "web"
paths = [ "/ground-up-promo/" ]
localPort = 21496

[services.development]
run = "pnpm --filter @workspace/ground-up-promo run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ground-up-promo", "run", "build" ]
serve = "static"
publicDir = "artifacts/ground-up-promo/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21496"
BASE_PATH = "/ground-up-promo/"
